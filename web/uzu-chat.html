<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uzu 9B — Fast Chat</title>
<style>
:root{
  --bg:#0f1115; --panel:#181b22; --ink:#e8eaed; --muted:#8b909a;
  --line:#2a2e37; --accent:#4ade80; --user:#3b82f6;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);height:100vh;
  display:flex;flex-direction:column}
header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:center}
header h1{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.03em}
header .stat{font-family:var(--mono);font-size:11px;color:var(--muted)}
header .stat b{color:var(--accent)}
.hdr-right{display:flex;gap:14px;align-items:center;min-width:0}
#lanes{background:var(--bg);border:1px solid var(--line);color:var(--ink);
  font-family:var(--mono);font-size:11px;padding:5px 8px;border-radius:6px;
  max-width:300px;cursor:pointer}
#lanes:focus{outline:none;border-color:var(--accent)}
#lanes option:disabled{color:var(--muted)}
#chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:10px 14px;border-radius:10px;font-size:14px;
  line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--user);color:#fff}
.msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.msg .meta{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:6px}
.msg.bot .meta{color:var(--accent)}
#bar{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);
  background:var(--panel)}
#in{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--ink);
  padding:10px 12px;border-radius:8px;font-size:14px;font-family:var(--sans)}
#in:focus{outline:none;border-color:var(--accent)}
button{background:var(--accent);color:#0f1115;border:0;padding:10px 18px;
  border-radius:8px;font-family:var(--mono);font-size:12px;font-weight:600;
  cursor:pointer}
button:disabled{opacity:.4;cursor:wait}
.hint{font-family:var(--mono);font-size:10px;color:var(--muted);padding:0 18px 8px}
</style>
</head>
<body>
<header>
  <h1>UZU 9B · FAST CHAT</h1>
  <div class="hdr-right">
    <select id="lanes" title="Target lane"></select>
    <span class="stat"><span id="lanestat"></span> · <b id="lastspeed">—</b></span>
  </div>
</header>
<div id="chat"></div>
<div class="hint">Talks straight to the uzu server with a minimal prompt — no agent scaffolding, so you get the full ~92 t/s. Best with predictable/structured requests.</div>
<div id="bar">
  <input id="in" placeholder="Ask anything (try: count 1 to 100 by commas)…" autofocus>
  <button id="send">Send</button>
</div>
<script>
const API=location.origin+'/api/uzu-chat';
const MODEL="alibaba:qwen3.5:9b:mirai:mirai-m:4";
const chat=document.getElementById('chat'), inp=document.getElementById('in'),
      send=document.getElementById('send'), speedEl=document.getElementById('lastspeed'),
      laneSel=document.getElementById('lanes'), laneStat=document.getElementById('lanestat');
// fallback when /api/config isn't deployed yet: the configured proxy lane
let lanes=[{id:'uzu-9b',label:'uzu-9b (:8096)',port:8096}];
let CFG=null;   // /api/config payload once it lands, else null

function mk(tag,cls,txt){const e=document.createElement(tag);
  if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e;}

function setLaneStat(){
  const o=laneSel.selectedOptions[0];
  if(!o){laneStat.textContent=''; return;}
  laneStat.textContent=o.getAttribute('data-port')
    ? o.getAttribute('data-label')+' :'+o.getAttribute('data-port')
    : o.getAttribute('data-label');
}

// pick the configured proxy lane, else the first loaded one
function defaultIndex(){
  const i=lanes.findIndex(l=>l.port===(CFG?CFG.uzu_port:null));
  return i>=0?i:0;
}

function paintLanes(){
  laneSel.textContent='';
  for(const l of lanes){
    const o=mk('option');
    o.value=l.id;
    o.setAttribute('data-port', l.port!=null?l.port:'');
    o.setAttribute('data-label', l.label||l.id);
    o.textContent=l.label||l.id;
    laneSel.appendChild(o);
  }
  laneSel.selectedIndex=defaultIndex();
  setLaneStat();
}

async function loadLanes(){
  try{
    const r=await fetch(location.origin+'/api/config');
    if(r.ok){
      const j=await r.json();
      if(Array.isArray(j.lanes)&&j.lanes.length){ lanes=j.lanes; CFG=j; }
    }
  }catch(e){/* keep the single-lane fallback */}
  paintLanes();
  // nicety: mark lanes that are currently off (skip if /api/status is absent)
  try{
    const r=await fetch(location.origin+'/api/status');
    if(!r.ok) return;
    const j=await r.json();
    const off={};
    for(const l of (j.lanes||[])) if(l.on===false) off[l.id]=true;
    for(const o of laneSel.options){
      const live=lanes.find(l=>l.id===o.value);
      if(off[live&&live.id]){ o.disabled=true; o.textContent+=' (off)'; }
    }
  }catch(e){}
}
laneSel.onchange=setLaneStat;
loadLanes();

function add(role){
  const d=document.createElement('div');
  d.className='msg '+role;
  const body=document.createElement('div'); body.className='body';
  const meta=document.createElement('div'); meta.className='meta';
  d.appendChild(body); d.appendChild(meta);
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
  return {d, body, meta};
}

async function go(){
  const text=inp.value.trim(); if(!text) return;
  inp.value='';
  const u=add('user'); u.body.textContent=text;
  send.disabled=true;
  const b=add('bot'); b.body.textContent='…'; b.meta.textContent='streaming';
  const t0=performance.now();
  let content='', reasoning='', toks=0, spec=0;
  const lane=laneSel.value||'uzu-9b';
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:MODEL,lane,messages:[{role:'user',content:text}],
        max_tokens:2048,temperature:0.6,stream:true})});
    // fetch resolves on HTTP errors too — surface the proxy's real error
    if(!r.ok){
      let detail='';
      try{ const j=await r.json(); detail=j.error||''; }catch(e){}
      throw new Error('proxy error ('+r.status+(detail?': '+detail:'')+')');
    }
    const reader=r.body.getReader(), dec=new TextDecoder();
    let buf='';
    while(true){
      const {done,value}=await reader.read();
      if(done) break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split(/\r?\n/); buf=lines.pop();  // handle CRLF
      for(const line of lines){
        if(!line.startsWith('data:')) continue;
        const payload=line.slice(5).trim();
        if(payload==='[DONE]') continue;
        let j; try{ j=JSON.parse(payload); }catch(e){ continue; }
        const delta=j.choices?.[0]?.delta||{};
        // reasoning tokens are NOT answer tokens. Prefer the upstream usage
        // total, then subtract reasoning so the reported rate is answer-only;
        // if that metric is unavailable we count streamed content deltas.
        if(delta.reasoning_content){ reasoning+=delta.reasoning_content; }
        if(delta.content){ content+=delta.content; toks++; }
        if(j.usage){
          spec=j.usage.spec_verify_ct||spec;
          // completion_tokens includes reasoning on reasoning models
          const rc = j.usage.completion_tokens_details
            ? (j.usage.completion_tokens_details.reasoning_tokens||0) : null;
          if(j.usage.completion_tokens!=null){
            toks = (rc!=null) ? Math.max(0, j.usage.completion_tokens - rc)
                              : j.usage.completion_tokens;
          }
        }
        // show thinking (dim) then the answer as it streams
        let display='';
        if(reasoning && !content) display='💭 '+reasoning;
        else if(content) display=content;
        else display='…';
        b.body.textContent=display;
        chat.scrollTop=chat.scrollHeight;
      }
    }
    const dt=(performance.now()-t0)/1000;
    b.body.textContent=content||('💭 '+reasoning)||'(empty — try a different prompt)';
    const tps=dt>0.05 ? toks/dt : 0;   // guard divide-by-zero on instant [DONE]
    b.meta.textContent=`${toks} tok · ${dt.toFixed(1)}s · ${tps.toFixed(0)} t/s · spec ${spec}/pass`;
    speedEl.textContent=`${tps.toFixed(0)} t/s last`;
  }catch(e){
    // surface the real proxy error (502 detail); fall back to the connectivity
    // hint for genuine network failures where no message was constructed
    const who=laneStat.textContent||'the selected lane';
    const msg = (e && e.message && /proxy error/.test(e.message))
      ? e.message + ' — is '+who+' up? (flip it on in Thrash, or pick another lane)'
      : 'cannot reach '+who+' (via the thrash proxy) — is it up? (flip it on in Thrash, or pick another lane)';
    b.body.textContent=msg;
    b.meta.textContent='';
  }
  send.disabled=false; inp.focus();
}
send.onclick=go;
inp.onkeydown=e=>{if(e.key==='Enter')go();};
</script>
</body>
</html>
