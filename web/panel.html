<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thrash</title>
<style>
:root{
  --bg:#eef0f3; --panel:#ffffff; --ink:#16181d; --muted:#6b7280;
  --line:#c9ced6; --line-soft:#e3e6eb;
  --on:#1a7f37; --load:#b7791f; --off:#9aa1ab; --alert:#c0392b;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.45;padding:20px;max-width:780px;margin:0 auto}

header{display:flex;justify-content:space-between;align-items:baseline;
  padding-bottom:12px;border-bottom:2px solid var(--ink);margin-bottom:16px}
header h1{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.02em}
header .srv{font-family:var(--mono);font-size:11px;color:var(--muted)}
header .srv .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
  background:var(--on);margin-right:5px;vertical-align:middle}
header .srv.down .dot{background:var(--alert)}

.mem{background:var(--panel);border:1px solid var(--line);padding:14px 16px;
  margin-bottom:18px}
.mem .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.mem .big{font-family:var(--mono);font-size:26px;font-weight:600}
.mem .big small{font-size:13px;color:var(--muted);font-weight:400}
.mem .verdict{font-family:var(--mono);font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted)}
.mem.low .verdict{color:var(--alert)}
.mem .bar{height:16px;background:var(--line-soft);border:1px solid var(--line);
  position:relative;overflow:hidden}
.mem .bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--on);
  transition:width .4s}
.mem.low .bar .fill{background:var(--alert)}
.mem .sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:7px}

.toolbar{display:flex;gap:8px;margin-bottom:14px;align-items:center}
button{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;
  background:var(--panel);color:var(--ink);border:1px solid var(--ink);
  padding:8px 14px;cursor:pointer}
button:hover{background:var(--ink);color:var(--panel)}
button.danger{border-color:var(--alert);color:var(--alert)}
button.danger:hover{background:var(--alert);color:#fff}
#msg{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}
#msg.err{color:var(--alert)}

.lane{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--off);
  padding:12px 14px;margin-bottom:8px;display:grid;
  grid-template-columns:1fr auto;gap:14px;align-items:center}
.lane.on{border-left-color:var(--on)}
.lane.loading{border-left-color:var(--load)}
.lane .nm{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
.lane .pill{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 6px;border:1px solid currentColor}
.lane.on .pill{color:var(--on)}
.lane.loading .pill{color:var(--load)}
.lane.off .pill{color:var(--off)}
.lane .meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}
.lane .impact{font-size:12px;color:var(--muted);margin-top:6px;max-width:56ch}
.lane .proj{font-family:var(--mono);font-size:11px;margin-top:5px}
.lane .proj.ok{color:var(--on)}
.lane .proj.warn{color:var(--load)}
.lane .proj.bad{color:var(--alert)}
.loglink{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  background:none;border:none;color:var(--muted);padding:0;cursor:pointer;text-decoration:underline;
  text-underline-offset:2px}
.loglink:hover{background:none;color:var(--ink)}
.loglink.off{color:var(--off)}
.lane .ctl{display:flex;flex-direction:column;align-items:center;gap:4px}

/* ---- log viewer drawer (academic-brutalism: hard borders, no gradients) ---- */
.scrim{position:fixed;inset:0;background:rgba(22,24,29,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,92vw);z-index:41;
  background:var(--panel);border-left:2px solid var(--ink);display:flex;flex-direction:column;
  font-family:var(--mono)}
.drawer .head{display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;border-bottom:1px solid var(--ink)}
.drawer .head .t{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.drawer .tools{display:flex;gap:8px;align-items:center;padding:10px 16px;
  border-bottom:1px solid var(--line-soft);background:var(--bg)}
.drawer .tools label{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.drawer select{font-family:var(--mono);font-size:11px;background:var(--panel);color:var(--ink);
  border:1px solid var(--ink);padding:5px 8px;cursor:pointer}
.drawer .caption{font-size:10px;color:var(--muted);padding:8px 16px 0;word-break:break-all}
.drawer pre{margin:0;flex:1;overflow:auto;background:#16181d;color:#d7dae0;
  font-family:var(--mono);font-size:11px;line-height:1.5;padding:12px 16px;white-space:pre;
  border-top:1px solid var(--line-soft);margin-top:8px}
.drawer .note{padding:12px 16px;font-size:11px;color:var(--muted)}
.drawer .note.err{color:var(--alert)}

.sw{position:relative;width:60px;height:32px;display:inline-block}
.sw input{opacity:0;width:0;height:0}
.sw .sl{position:absolute;inset:0;background:#cfd4db;border:1px solid var(--ink);
  cursor:pointer;transition:background .15s}
.sw .sl:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;
  background:#fff;border:1px solid var(--ink);transition:transform .15s}
.sw input:checked + .sl{background:var(--on)}
.sw input:checked + .sl:before{transform:translateX(28px)}
.sw.loading .sl{background:var(--load);cursor:wait}
.sw.loading .sl:before{transform:translateX(14px)}
.sw input:disabled + .sl{opacity:.5;cursor:wait}
.sw input:focus-visible + .sl{outline:2px solid var(--alert);outline-offset:2px}
.st{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.st.on{color:var(--on)} .st.loading{color:var(--load)}

footer{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:16px;
  padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between}
</style>
</head>
<body>

<header>
  <h1>THRASH</h1>
  <span class="srv" id="srv"><span class="dot"></span><span id="srvtxt">connecting…</span></span>
</header>

<div class="mem" id="mem">
  <div class="top">
    <div class="big" id="memavail">—</div>
    <div class="verdict" id="memverdict">—</div>
  </div>
  <div class="bar"><div class="fill" id="memfill" style="width:0%"></div></div>
  <div class="sub" id="memsub">—</div>
</div>

<div class="toolbar">
  <button onclick="refresh()">Refresh</button>
  <button class="danger" onclick="freeAll()">Free all big models</button>
  <a href="/uzu-chat" target="_blank" style="font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;background:var(--panel);color:var(--on);border:1px solid var(--on);padding:8px 14px;cursor:pointer;text-decoration:none">uzu 9B fast chat →</a>
  <span id="msg"></span>
</div>

<div id="lanes"></div>

<footer>
  <span id="foot">—</span>
  <span>127.0.0.1:8790</span>
</footer>

<script>
const API = location.origin;   // same-origin as this page — follows config port
let DATA = null;
const pending = {};   // id -> {want:bool, since:epoch_ms}
const pollers = {};   // id -> interval handle (guards against duplicate pollers)

// ---- log viewer -------------------------------------------------------
// /api/logs may not be deployed yet; probe once on load so the button
// goes inert instead of every click failing.
let LOGS_BROKEN = true;
let logLines = 300;              // selected tail length
let logLane = null;              // {id,label} currently open
let logState = 'idle';           // idle | loading | ok | missing | error

(function probeLogs(){
  fetch(API+'/api/logs?id=__probe__&lines=1')
    .then(r=>{ LOGS_BROKEN = !r.ok; })
    .catch(()=>{ LOGS_BROKEN = true; })
    .finally(()=>{ try{ render(); }catch(e){} });
})();

function esc(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function msg(t,err){const e=document.getElementById('msg');e.textContent=t;e.className=err?'err':''}

async function refresh(){
  try{
    const r = await fetch(API+'/api/status');
    if(!r.ok) throw new Error('http '+r.status);
    DATA = await r.json();
    document.getElementById('srv').className='srv';
    document.getElementById('srvtxt').textContent='live';
    render();
  }catch(e){
    document.getElementById('srv').className='srv down';
    document.getElementById('srvtxt').textContent='server down';
    msg('cannot reach the thrash server — is it running?', true);
  }
}

function gb(mb){return (mb/1024).toFixed(mb>=10240?0:1)}

function render(){
  const m = DATA.memory||{};
  const hasTotal = m.total_mb && m.total_mb > 0;
  const avail=m.available_mb||0, total=hasTotal?m.total_mb:1, pct=hasTotal?Math.round(avail/total*100):0;
  const low = hasTotal && pct < 20;   // only warn when we actually know the total
  const mem=document.getElementById('mem');
  mem.className='mem'+(low?' low':'');
  // build the free/total line without innerHTML — all numeric or known-safe
  const ma=document.getElementById('memavail');
  ma.textContent = (avail/1024).toFixed(1);
  const small=document.createElement('small');
  small.textContent = hasTotal ? ` / ${(total/1024).toFixed(0)} GB free` : ' — memory unknown';
  ma.appendChild(small);
  document.getElementById('memverdict').textContent =
    !hasTotal ? '—' : (low? 'low — free a lane' : (pct<45? 'ok':'comfortable'));
  document.getElementById('memfill').style.width=pct+'%';
  document.getElementById('memsub').textContent =
    `wired ${gb(m.wired_mb||0)} GB · compressed ${gb(m.compressed_mb||0)} GB · ${hasTotal?pct+'%':'?'} available`;

  const box=document.getElementById('lanes'); box.innerHTML='';
  (DATA.lanes||[]).forEach(l=>{
    const p = pending[l.id];
    let state = l.on ? 'on' : 'off';
    if(p && p.want !== l.on){
      if(Date.now()-p.since > 150000){ delete pending[l.id]; }
      else state = 'loading';
    } else if(p && p.want === l.on){ delete pending[l.id]; }

    const ram=l.ram_mb? (l.ram_mb>=1024? `${(l.ram_mb/1024).toFixed(0)} GB` : `${l.ram_mb} MB`) : '—';
    const div=document.createElement('div');
    div.className='lane '+state;
    const disabled = state==='loading' ? 'disabled' : '';
    const checked = (state==='on' || (state==='loading'&&p&&p.want)) ? 'checked':'';
    const info=document.createElement('div');
    const nm=document.createElement('div'); nm.className='nm';
    nm.textContent = l.label || l.id;
    const pill=document.createElement('span'); pill.className='pill';
    pill.textContent = state==='loading'?'loading':state;
    nm.appendChild(pill);
    const meta=document.createElement('div'); meta.className='meta';
    meta.textContent = `:${l.port||'—'} · ~${ram} when on · ${l.kind||''}`;
    const impact=document.createElement('div'); impact.className='impact';
    impact.textContent = l.impact || '';
    info.appendChild(nm); info.appendChild(meta); info.appendChild(impact);

    // RAM projection hint — only for lanes that are coming up, only when we know the size
    if(state==='loading' && l.ram_mb > 0 && hasTotal){
      const proj = avail - l.ram_mb;
      const cls = proj < 2048 ? 'bad' : (proj < 6144 ? 'warn' : 'ok');
      const projEl=document.createElement('div'); projEl.className='proj '+cls;
      projEl.textContent = `after start: ~${gb(proj)} GB free`+(proj<2048?' — not enough headroom':'');
      info.appendChild(projEl);
    }

    const ctl=document.createElement('div'); ctl.className='ctl';
    const label=document.createElement('label'); label.className='sw '+(state==='loading'?'loading':'');
    const input=document.createElement('input'); input.type='checkbox';
    if(checked) input.checked=true;
    if(disabled) input.disabled=true;
    // event listener (not an inline string handler) — lane ids can't inject JS
    input.addEventListener('change', e=>toggleLane(l.id, e.target.checked));
    const sl=document.createElement('span'); sl.className='sl';
    label.appendChild(input); label.appendChild(sl);
    const st=document.createElement('span'); st.className='st '+state;
    st.textContent = state==='loading'?'…':state;
    ctl.appendChild(label); ctl.appendChild(st);

    // per-lane log viewer entry point — stays clickable even when the endpoint
    // is missing, so the drawer can explain itself instead of a dead button
    const lb=document.createElement('button'); lb.className='loglink'+(LOGS_BROKEN?' off':'');
    lb.type='button';
    lb.textContent='logs';
    lb.title = LOGS_BROKEN ? 'log viewer unavailable on this server' : `view ${l.id} log`;
    lb.addEventListener('click', ()=>openLogs(l.id, l.label||l.id));
    ctl.appendChild(lb);

    div.appendChild(info); div.appendChild(ctl);
    box.appendChild(div);
  });
  const lanes = DATA.lanes||[];
  document.getElementById('foot').textContent =
    `${lanes.length} lanes · updated ${new Date((DATA.ts||0)*1000).toLocaleTimeString()}`;
}

async function toggleLane(id, on){
  pending[id] = {want:on, since:Date.now()};
  msg(`${on?'loading':'stopping'} ${id}…`);
  render();
  try{
    const r=await fetch(API+'/api/toggle',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({id,on})});
    const d=await r.json();
    msg(d.ok? `${id}: ${d.message}` : `failed: ${d.message}`, !d.ok);
    if(d.status){DATA=d.status;}
    pollUntilSettled(id, on);
  }catch(e){ msg('toggle failed', true); pollUntilSettled(id,on); }
}

function pollUntilSettled(id, want){
  const existing = pollers[id];
  if(existing && existing.want === want) return;   // already polling for this target
  if(existing){ clearInterval(existing.iv); }        // target changed — replace the poller
  let tries=0;
  const rec={want, iv:null};
  const done=()=>{ if(pollers[id]===rec){ clearInterval(rec.iv); delete pollers[id]; } delete pending[id]; };
  rec.iv=setInterval(async()=>{
    tries++;
    try{
      const r=await fetch(API+'/api/status'); DATA=await r.json();
      const lane=(DATA.lanes||[]).find(l=>l.id===id);
      if(!lane || lane.on===want || tries>20){
        done(); render();
        if(lane&&lane.on===want) msg(`${id} ${want?'up':'stopped'}`);
      } else render();
    }catch(e){ if(tries>20){done();} }
  }, 4000);
  pollers[id]=rec;
}

async function freeAll(){
  msg('freeing big models…');
  for(const id of ['qwen-35b','qwen-9b']){
    pending[id]={want:false,since:Date.now()};
    try{await fetch(API+'/api/toggle',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({id,on:false})});}catch(e){}
  }
  setTimeout(()=>{delete pending['qwen-35b'];delete pending['qwen-9b'];refresh();msg('freed');},2000);
}

// ---- log viewer ------------------------------------------------------
function ensureDrawer(){
  let d = document.getElementById('drawer');
  if(d) return d;

  const scrim=document.createElement('div'); scrim.className='scrim'; scrim.id='logscrim';
  scrim.addEventListener('click', closeLogs);

  d=document.createElement('div'); d.className='drawer'; d.id='drawer'; d.setAttribute('role','dialog');
  d.setAttribute('aria-label','lane logs');

  const head=document.createElement('div'); head.className='head';
  const t=document.createElement('span'); t.className='t'; t.id='logtitle';
  const close=document.createElement('button'); close.type='button'; close.textContent='close';
  close.addEventListener('click', closeLogs);
  head.appendChild(t); head.appendChild(close);

  const tools=document.createElement('div'); tools.className='tools';
  const lab=document.createElement('label'); lab.textContent='lines';
  const sel=document.createElement('select'); sel.id='logsel';
  [100,300,1000].forEach(n=>{
    const o=document.createElement('option'); o.value=String(n);
    o.textContent=String(n); if(n===logLines) o.selected=true;
    sel.appendChild(o);
  });
  sel.addEventListener('change', ()=>{ logLines=parseInt(sel.value,10)||300; loadLogs(); });
  tools.appendChild(lab); tools.appendChild(sel);

  const cap=document.createElement('div'); cap.className='caption'; cap.id='logpath';
  const body=document.createElement('div'); body.id='logbody'; body.style.display='flex';
  body.style.flexDirection='column'; body.style.flex='1'; body.style.minHeight='0';

  d.appendChild(head); d.appendChild(tools); d.appendChild(cap); d.appendChild(body);
  document.body.appendChild(scrim); document.body.appendChild(d);
  if(!window.__logEscBound){
    window.__logEscBound = true;
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeLogs(); });
  }
  return d;
}

function closeLogs(){
  const d=document.getElementById('drawer'); if(d) d.remove();
  const s=document.getElementById('logscrim'); if(s) s.remove();
  logLane=null; logState='idle';
}

function openLogs(id, label){
  logLane={id,label};
  logState='loading';
  const d=ensureDrawer();
  document.getElementById('logtitle').textContent = `logs · ${label}`;
  document.getElementById('logpath').textContent = 'resolving…';
  d.querySelector('#logbody').replaceChildren();
  const note=document.createElement('div'); note.className='note'; note.id='lognote';
  note.textContent='fetching…';
  d.querySelector('#logbody').appendChild(note);
  loadLogs();
}

async function loadLogs(){
  if(!logLane) return;
  const body=document.getElementById('logbody');
  const pathEl=document.getElementById('logpath');
  body.replaceChildren();
  const note=document.createElement('div'); note.className='note'; note.id='lognote';
  note.textContent='fetching…';
  body.appendChild(note);
  pathEl.textContent='';
  logState='loading';
  try{
    const r=await fetch(`${API}/api/logs?id=${encodeURIComponent(logLane.id)}&lines=${logLines}`);
    if(r.status===404 || r.status===501){
      logState='missing';
      note.className='note err';
      note.textContent='logs unavailable — the server has no /api/logs endpoint yet.';
      return;
    }
    if(!r.ok){ logState='error'; note.className='note err'; note.textContent=`could not read logs (http ${r.status}).`; return; }
    const d=await r.json();
    const path=document.getElementById('logpath');
    path.textContent = d.path ? `path: ${d.path}` : 'path: (server did not report one)';
    if(d.exists === false || !d.tail){
      logState='missing';
      note.className='note';
      note.textContent = d.exists === false
        ? `no log file yet for ${logLane.label} — start the lane to create one.`
        : `log file is empty.`;
      return;
    }
    logState='ok';
    note.remove();
    const pre=document.createElement('pre'); pre.id='logpre';
    // textContent, never innerHTML — log lines are untrusted server data
    pre.textContent = d.tail;
    body.appendChild(pre);
    pre.scrollTop = pre.scrollHeight;   // open at the newest line
  }catch(e){
    logState='error';
    note.className='note err';
    note.textContent='could not reach the log endpoint.';
  }
}

refresh();
setInterval(refresh, 12000);
</script>
</body>
</html>
